name: sentinel_qr
description: A zero-trust QR code scanner that sandboxes every destination before opening it.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # QR Scanning
  mobile_scanner: ^5.2.3

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.5
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
